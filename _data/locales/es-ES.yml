# The layout text of site

# ----- Commons label -----

layout:
  post: Entrada
  category: Categoría
  tag: Etiqueta

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Inicio
  categories: Categorías
  tags: Etiquetas
  archives: Archivo
  about: Acerca de
  readings: Lecturas

# the text displayed in the search bar & search results
search:
  hint: Buscar
  cancel: Cancelar
  no_results: ¡Oops! No se encuentran resultados.

panel:
  lastmod: Actualizado recientemente
  trending_tags: Etiquetas populares
  toc: Contenido

copyright:
  # Shown at the bottom of the post
  license:
    template: Esta entrada está licenciada bajo :LICENSE_NAME por el autor.
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/

  # Displayed in the footer
  brief: Algunos derechos reservados.
  verbose: >-
    Salvo que se indique explícitamente, las entradas de este blog están licenciadas
    bajo la Creative Commons Attribution 4.0 International (CC BY 4.0) License por el autor.

meta: Hecho con :PLATFORM usando el tema :THEME

not_found:
  statment: Lo sentimos, hemos perdido esa URL o apunta a algo que no existe.

notification:
  update_found: Hay una nueva versión de contenido disponible.
  update: Actualizar

# ----- Posts related labels -----

post:
  written_by: Por
  posted: Publicado
  updated: Actualizado
  words: palabras
  pageview_measure: visitas
  read_time:
    unit: min
    prompt: " de lectura"
  relate_posts: Lecturas adicionales
  share: Compartir
  button:
    next: Más reciente
    previous: Anterior
    copy_code:
      succeed: ¡Copiado!
    share_link:
      title: Copiar enlace
      succeed: ¡Enlace copiado!

  pin_prompt: Fijado

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%d/%m/%Y"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

# categories page
categories:
  category_measure:
    singular: categoría
    plural: categorías
  post_measure:
    singular: entrada
    plural: entradas

# ----- Custom (bilingual UI) -----

site:
