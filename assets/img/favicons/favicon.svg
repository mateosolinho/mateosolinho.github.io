<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1f23"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- orbit, back half (behind the M) -->
  <path d="M7 40 A26 9 -20 0 1 57 23" fill="none" stroke="url(#orbit)" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <!-- M -->
  <path d="M18 45 V20 L32 35 L46 20 V45" fill="none" stroke="#f8fafc" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- orbit, front half -->
  <path d="M57 23 A26 9 -20 0 1 7 40" fill="none" stroke="url(#orbit)" stroke-width="3" stroke-linecap="round"/>
  <!-- satellite -->
  <circle cx="35.1" cy="40" r="4.2" fill="#fbbf24" stroke="#0a0a0a" stroke-width="1.5"/>
</svg>
